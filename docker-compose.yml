services:
  nginx:
    image: nginx:1.31.2-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - /opt/docker/cdn/uploads:/data:ro
      - /opt/docker/cdn/config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/docker/cdn/config/00-global.conf:/etc/nginx/conf.d/00-global.conf:ro

  tunnel:
    image: cloudflare/cloudflared:2026.6.0
    container_name: tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
