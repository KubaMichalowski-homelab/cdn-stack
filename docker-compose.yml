services:
  nginx:
    image: nginx:1.31.1-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - /opt/docker/cdn/uploads:/data:ro
    configs:
      - source: nginx_default
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_global
        target: /etc/nginx/conf.d/00-global.conf

  tunnel:
    image: cloudflare/cloudflared:2026.5.2
    container_name: tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx

configs:
  nginx_default:
    file: ./nginx/default.conf
  nginx_global:
    file: ./nginx/00-global.conf
